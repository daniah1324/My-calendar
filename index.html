<style>

.bc{color:#fff;text-align:center;padding:34px 12px;border:0}.bc h3{font-size:24px;margin:0 0 14px;color:#fff}.bc p{font-size:12px;margin:5px 0}
@media(max-width:1000px){.sg{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.sg{grid-template-columns:1fr}}
.pc{display:flex;gap:8px;margin:8px 0 12px}.pc button{flex:1;border:2px solid var(--c);background:transparent}.pc button.on{background:var(--c);color:#fff}
.tk{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;margin-bottom:5px;background:var(--row);border-inline-start:5px solid var(--c)}
.tk input[type=checkbox]{width:22px;height:22px;padding:0;flex:none}.tk .tt{flex:1;font-size:15px;word-break:break-word;cursor:pointer}
.tk small{color:var(--c);font-weight:700;font-size:11px;cursor:pointer;padding:6px 4px}.tk.dn2 .tt{text-decoration:line-through;opacity:.5}
.tk button{padding:2px 8px;min-height:0;border:0;background:none;color:var(--mu)}
</style></head><body>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const D=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MN=new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn',{month:'long'});
const HF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const HD=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric'});
const HM=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{month:'long',year:'numeric'});
const S1=['2026-08-23','2026-08-30','2026-09-06','2026-09-13','2026-09-20','2026-09-27','2026-10-04','2026-10-11','2026-10-18','2026-10-25','2026-11-01','2026-11-08','2026-11-15','2026-11-29','2026-12-06','2026-12-13'];
const S2=['2027-01-17','2027-01-24','2027-01-31','2027-02-07','2027-02-14','2027-02-21','2027-03-14','2027-03-21','2027-03-28','2027-04-04','2027-04-11','2027-04-18','2027-04-25','2027-05-02','2027-05-23','2027-05-30'];
const INFO={},DAYS={};
[[S1,1],[S2,2]].forEach(([L,s])=>L.forEach((k,i)=>{const n=(s==2&&i==15)?2:5;for(let j=0;j<n;j++){const d=D(k);d.setDate(d.getDate()+j);INFO[K(d)]={s,w:i+1}}}));
const P={exam:4,extra:3,hol:2,brk:1};
const HP=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric'});
const HMo=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{month:'long'});
const hp=d=>{const q=HP.formatToParts(d);return q.find(x=>x.type=='month').value+'/'+q.find(x=>x.type=='day').value};
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر'];
const GN='linear-gradient(135deg,#12a05c,#0a6b3a)',GB='linear-gradient(135deg,#a8743c,#6e4620)',GX='linear-gradient(135deg,#f7bf45,#e58a12)';
const BR={au:['2026-11-20','2026-11-28','brk','إجازة الخريف','linear-gradient(160deg,#f7a65e,#e8641a)'],
f1:['2026-12-20','2026-12-31','exam','الاختبارات النهائية','linear-gradient(160deg,#4d5780,#232844)'],
fi:['2027-02-26','2027-03-13','brk','إجازة عيد الفطر','linear-gradient(160deg,#7a4fe0,#2a3f9c)'],
ad:['2027-05-07','2027-05-22','brk','إجازة عيد الأضحى','linear-gradient(160deg,#35b6f2,#1f56c9)'],
f2:['2027-06-01','2027-06-14','exam','الاختبارات النهائية','linear-gradient(160deg,#4d5780,#232844)']};
const RG=[['2026-09-23','2026-09-24','hol','إجازة اليوم الوطني',GN],['2027-02-21','2027-02-22','hol','إجازة يوم التأسيس',GB],...Object.values(BR),
['2026-10-25','2026-10-25','extra','إجازة إضافية',GX],['2026-11-29','2026-11-29','extra','إجازة إضافية',GX],['2027-01-07','2027-01-07','extra','إجازة إضافية',GX],['2027-04-11','2027-04-11','extra','إجازة إضافية',GX]];
RG.forEach(([a,b,kd,lb,g])=>{for(let d=D(a);K(d)<=b;d.setDate(d.getDate()+1)){const x=DAYS[K(d)]=DAYS[K(d)]||{l:[],m:[]};x.l.push(lb);if(!x.kind||P[kd]>P[x.kind]){x.kind=kd;x.g=g}}});
const MK={reward:['المكافأة الجامعية','--reward','linear-gradient(135deg,#19b894,#0a7a62)'],citizen:['حساب المواطن','--citizen','linear-gradient(135deg,#2f6fe0,#2a3d9a)'],drop:['نهاية الحذف والإضافة','--drop','linear-gradient(135deg,#1fc3d6,#0f95a8)'],ws:['بداية الاعتذار بعلامة W','--ws','linear-gradient(135deg,#9a4fd0,#6a2f9a)'],wend:['نهاية الاعتذار بعلامة W','--wend','linear-gradient(135deg,#f6b13a,#e58f10)'],ss:['بداية طلبات التخصص وتغييره','--ss','linear-gradient(135deg,#e53946,#b8222e)'],se:['نهاية طلبات التخصص وتغييره','--se','linear-gradient(135deg,#ee82bd,#d457a0)'],mid:['بداية الاختبارات النصفية','--mid','linear-gradient(135deg,#626b7e,#434a5c)']};
const bgOf=X=>X.g||(X.m.length?MK[X.m[0]][2]:'');
[['2026-08-27','reward'],['2026-08-27','drop'],['2026-08-30','ws'],['2026-09-10','citizen'],['2026-09-20','ss'],['2026-09-27','reward'],['2026-10-11','citizen'],['2026-10-11','mid'],['2026-10-27','reward'],['2026-11-10','citizen'],['2026-12-03','wend'],['2026-12-10','se'],['2026-12-10','citizen'],
['2027-01-21','drop'],['2027-01-24','ws'],['2027-01-27','reward'],['2027-02-10','citizen'],['2027-02-14','ss'],['2027-03-21','mid'],['2027-03-28','reward'],['2027-04-11','citizen'],['2027-04-27','reward'],['2027-05-05','wend'],['2027-05-27','reward'],['2027-05-27','se']]
.forEach(([k,c])=>{const x=DAYS[k]=DAYS[k]||{l:[],m:[]};x.m.push(c)});
$('#lg').innerHTML=Object.values(MK).map(v=>`<span style="--c:var(${v[1]})">${v[0]}</span>`).join('')+'<span style="--c:#f5b73a">إجازة إضافية</span><span style="--c:#e8641a">إجازات وعطل</span><span style="--c:#9a8fe0">الويكند</span>';
$('#wd').innerHTML=WD.map(w=>`<div class="wd">${w}</div>`).join('');
let ev=[],tk=[];try{ev=JSON.parse(localStorage.getItem('juc-ev')||'[]')}catch(e){}
try{tk=JSON.parse(localStorage.getItem('juc-tk')||'[]')}catch(e){}
const saveL=()=>{try{localStorage.setItem('juc-ev',JSON.stringify(ev));localStorage.setItem('juc-tk',JSON.stringify(tk))}catch(e){}};
const save=()=>{saveL();push()};
const evOn=k=>ev.filter(e=>!e.del&&e.s<=k&&k<=e.e);
let cur=new Date();cur.setDate(1);let cd=K(new Date());let view='a',sem=K(new Date())<'2027-01-01'?1:2;
function renderM(){
 $('#wd').style.display='';$('#gr').className='g';
 const y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1).getDay(),today=K(new Date());
 const last=new Date(y,m+1,0);
 {const a=HM.format(new Date(y,m,1)),b=HM.format(last);$('#mt').innerHTML=`${a==b?a:a+' – '+b}<small>${MN.format(cur)} ${y}</small>`}
 let h='';
 for(let i=0;i<42;i++){
  const d=new Date(y,m,1-f+i);if(i>=35&&d.getMonth()!=m)break;
  const k=K(d),I=INFO[k],X=DAYS[k]||{l:[],m:[]},E=evOn(k);
  const hdn=HD.format(d),hd=hdn+(hdn=='1'?' '+HMo.format(d):''),gd=d.getDate()==1?d.getDate()+' '+MN.format(d):d.getDate(),g=bgOf(X);
  h+=`<div class="c ${d.getMonth()!=m?'o ':''}${d.getDay()>=5?'w ':''}${g?'cl ':''}${k==today?' td':''}"${g?` style="background:${g}"`:''} data-k="${k}"><div class="n"><b>${hd}</b><i>${gd}</i></div>`
   +(I&&d.getDay()==0?`<div class="t">ف${I.s} · أ${I.w}</div>`:'')
   +(X.l[0]?`<div class="l">${X.l[0]}</div>`:'')
   +X.m.map(c=>`<div class="l">${MK[c][0]}</div>`).join('')
   +E.slice(0,2).map(e=>`<div class="e" style="background:${e.c}">${esc(e.t)}</div>`).join('')
   +(E.length>2?`<div class="l">+${E.length-2}</div>`:'')+`</div>`;
 }
 $('#gr').innerHTML=h;
}
function dayRow(d){const k=K(d),X=DAYS[k]||{l:[],m:[]},E=evOn(k),g=bgOf(X),lb=[...X.l,...X.m.map(c=>MK[c][0])].join(' · ');
 return `<div class="rw${g?' cl':''}${k==K(new Date())?' td':''}"${g?` style="background:${g}"`:''} data-k="${k}"><span class="dn">${WD[d.getDay()]}</span><em>${lb}</em>${E.length?'<u>'+E.map(e=>`<s style="background:${e.c}"></s>`).join('')+'</u>':''}<b>${hp(d)}</b><small>${d.getMonth()+1}/${d.getDate()}</small></div>`}
function wcard(L,i){const n=(sem==2&&i==15)?2:5;let r='';for(let j=0;j<n;j++){const d=D(L[i]);d.setDate(d.getDate()+j);r+=dayRow(d)}return `<div class="wk"><h4>الأسبوع ${ORD[i]}</h4>${r}</div>`}
function bcard(b){const A=D(b[0]),Z=D(b[1]),f=d=>`${WD[d.getDay()]} ${d.getDate()} ${MN.format(d)}`;
 return `<div class="wk bc" style="background:${b[4]}"><h3>${b[3]}</h3><p>${f(A)} – ${f(Z)} ${Z.getFullYear()}</p><p>${HF.format(A)} – ${HF.format(Z)}</p></div>`}
function renderAc(){
 const L=sem==1?S1:S2,o=sem==1?[[0,12],BR.au,[13,15],BR.f1]:[[0,5],BR.fi,[6,13],BR.ad,[14,15],BR.f2];
 $('#mt').innerHTML=`الفصل الدراسي ${sem==1?'الأول':'الثاني'}<small>${sem==1?'أغسطس – ديسمبر 2026':'يناير – يونيو 2027'}</small>`;
 $('#wd').style.display='none';$('#gr').className='sg';
 let h='';o.forEach(x=>{if(typeof x[0]=='number'){for(let i=x[0];i<=x[1];i++)h+=wcard(L,i)}else h+=bcard(x)});
 $('#gr').innerHTML=h;
}
function render(){view=='m'?renderM():renderAc();upBadge()}
function sv(v){view=v;$('#vm').classList.toggle('p',v=='m');$('#va').classList.toggle('p',v=='a');render()}
function go(dx){if(view=='m')cur.setMonth(cur.getMonth()+dx);else sem=sem==1?2:1;render()}
function openDay(k){
 cd=k;const d=D(k),I=INFO[k],X=DAYS[k]||{l:[],m:[]};
 let h=`<h2>${HF.format(d)}</h2><p class="mu">${WD[d.getDay()]} ${d.getDate()} ${MN.format(d)} ${d.getFullYear()}</p>`;
 const a=[];if(I)a.push(`<div class="it" style="--c:var(--acc)">الفصل ${I.s==1?'الأول':'الثاني'} · الأسبوع ${I.w}</div>`);
 X.l.forEach(l=>a.push(`<div class="it" style="--c:var(--ss)">${l}</div>`));
 X.m.forEach(c=>a.push(`<div class="it" style="--c:var(${MK[c][1]})">${MK[c][0]}</div>`));
 h+=a.join('')||'<p class="mu">لا توجد مناسبات أكاديمية في هذا اليوم.</p>';
 h+='<h3>أحداثي</h3>'+(evOn(k).map(e=>`<div class="it ev" style="--c:${e.c}" data-id="${e.id}">${esc(e.t)}<small>${e.tm||''}</small></div>`).join('')||'<p class="mu">لا توجد أحداث.</p>');
 h+='<div class="ac"><button class="p" id="nw">＋ إضافة حدث</button></div><div id="fm"></div>';
 $('#sb').innerHTML=h;$('#ov').hidden=false;
}
function form(id){
 const e=ev.find(x=>x.id==id)||{t:'',s:cd,e:cd,tm:'',n:'',c:'#4b3fd6'};
 $('#fm').innerHTML=`<h3>${id?'تعديل الحدث':'حدث جديد'}</h3><label>العنوان</label><input id="ft" value="${esc(e.t)}">
 <div class="r"><div><label>من</label><input type="date" id="fs" value="${e.s}"></div><div><label>إلى</label><input type="date" id="fe" value="${e.e}"></div><div><label>الوقت</label><input type="time" id="ftm" value="${e.tm}"></div></div>
 <label>ملاحظة</label><textarea id="fn" rows="2">${esc(e.n)}</textarea>
 <div class="sw">${['#4b3fd6','#d92d3a','#0d9b6a','#f0a020','#e66fb0'].map(c=>`<label><input type="radio" name="fc" value="${c}" ${c==e.c?'checked':''}><span style="background:${c}"></span></label>`).join('')}</div>
 <div class="ac"><button class="p" id="sv">حفظ</button>${id?'<button class="d" id="dl">حذف</button>':''}</div>`;
 $('#ft').focus();
 $('#sv').onclick=()=>{
  const t=$('#ft').value.trim();if(!t){$('#ft').focus();return}
  let s=$('#fs').value||cd,en=$('#fe').value||s;if(en<s)[s,en]=[en,s];
  const o={u:Date.now(),id:id||Date.now(),t,s,e:en,tm:$('#ftm').value,n:$('#fn').value,c:document.querySelector('input[name=fc]:checked').value};
  if(id)ev=ev.map(x=>x.id==id?o:x);else ev.push(o);
  save();render();openDay(cd);
 };
 if(id)$('#dl').onclick=()=>{ev=ev.map(x=>x.id==id?{id,del:1,u:Date.now()}:x);save();render();openDay(cd)};
}
$('#gr').onclick=e=>{const c=e.target.closest('[data-k]');if(c)openDay(c.dataset.k)};
$('#sb').onclick=e=>{
 if(e.target.id=='nw')form(null);
 const v=e.target.closest('.ev');if(v)form(+v.dataset.id);
};
$('#x').onclick=()=>$('#ov').hidden=true;
$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').hidden=true};
$('#add').onclick=()=>{openDay(cd);form(null)};
$('#pv').onclick=()=>go(1);
$('#nx').onclick=()=>go(-1);
$('#td').onclick=()=>{cur=new Date();cur.setDate(1);sem=K(new Date())<'2027-01-01'?1:2;render()};
// ===== المزامنة (Firebase Firestore) =====
const FB={apiKey:"AIzaSyDMhd4ytYqeIIRxG7ht_Yh_TGq-wd8XoH0",authDomain:"my-calendar-78db7.firebaseapp.com",projectId:"my-calendar-78db7",appId:"1:267018010831:web:f275896fd3ba9ce76cf7ba"}; // الصقي هنا إعدادات Firebase
let db=null,unsub=null,st='',code='';
try{code=localStorage.getItem('juc-code')||''}catch(e){}
const setSt=t=>{st=t;const x=$('#sst');if(x)x.textContent=t};
const norm=a=>JSON.stringify([...a].sort((x,y)=>x.id-y.id));
function merge(a,b){const m={};[...a,...b].forEach(e=>{if(!m[e.id]||(e.u||0)>(m[e.id].u||0))m[e.id]=e});return Object.values(m)}
function push(){if(!db||!code)return;db.collection('cal').doc(code).set({ev:JSON.stringify(ev),tk:JSON.stringify(tk),t:Date.now()}).then(()=>setSt('✓ تمت المزامنة')).catch(()=>setSt('تعذّرت المزامنة'))}
function connect(){
 if(unsub){unsub();unsub=null}
 if(typeof firebase=='undefined'){setSt('تعذّر تحميل Firebase');return}
 if(!FB.apiKey){setSt('لم يتم إعداد Firebase في الملف بعد');return}
 if(code.length<8){setSt('رمز المزامنة قصير (8 أحرف على الأقل)');return}
 if(!db){firebase.initializeApp(FB);db=firebase.firestore()}
 setSt('جارٍ الاتصال…');
 unsub=db.collection('cal').doc(code).onSnapshot(s=>{
  let r=[],rt=[];try{if(s.exists){r=JSON.parse(s.data().ev||'[]');rt=JSON.parse(s.data().tk||'[]')}}catch(e){}
  ev=merge(ev,r);tk=merge(tk,rt);saveL();render();drawTasks();
  if(norm(ev)!==norm(r)||norm(tk)!==norm(rt))push();else setSt('✓ متصل ومتزامن');
 },()=>setSt('تعذّر الاتصال'));
}
function openSync(){
 $('#sb').innerHTML=`<h2>المزامنة بين الأجهزة</h2><p class="mu">اكتبي نفس الرمز في كل جهاز. اجعليه طويلاً وصعب التخمين، فهو الذي يحمي أحداثك.</p><label>رمز المزامنة</label><input id="sco" dir="ltr" autocapitalize="off" autocomplete="off" value="${esc(code)}"><div class="ac"><button class="p" id="sc">اتصال</button></div><p class="mu" id="sst">${esc(st)}</p>`;
 $('#ov').hidden=false;
 $('#sc').onclick=()=>{code=$('#sco').value.replace(/[\/\s]/g,'');try{localStorage.setItem('juc-code',code)}catch(e){}connect()};
}
const PR={u:['عاجل','#d92d3a'],n:['عادي','#2f6fe0'],l:['غير عاجل','#0d9b6a']},PO={u:0,n:1,l:2},NX={u:'n',n:'l',l:'u'};
let tp='n',te=null;
function upBadge(){const n=tk.filter(t=>!t.del&&!t.d).length;$('#tb').textContent='📝 المهام'+(n?' ('+n+')':'')}
function drawTasks(){const el=$('#tl');if(!el)return;
 const L=tk.filter(t=>!t.del).sort((a,b)=>(a.d?1:0)-(b.d?1:0)||PO[a.p]-PO[b.p]||b.id-a.id);
 el.innerHTML=L.map(t=>`<div class="tk${t.d?' dn2':''}" style="--c:${PR[t.p][1]}"><input type="checkbox" data-ck="${t.id}" ${t.d?'checked':''}><span class="tt" data-ed="${t.id}">${esc(t.t)}</span><small data-pr="${t.id}">${PR[t.p][0]}</small><button data-rm="${t.id}">✕</button></div>`).join('')||'<p class="mu">لا توجد مهام بعد.</p>';
}
function upd(id,ch){tk=tk.map(x=>x.id==id?(ch.del?{id:x.id,del:1,u:Date.now()}:{...x,...ch,u:Date.now()}):x);save();drawTasks();upBadge()}
function chips(){document.querySelectorAll('.pc button').forEach(b=>b.classList.toggle('on',b.dataset.p==tp))}
function addTask(){const v=$('#ti').value.trim();if(!v){$('#ti').focus();return}
 if(te){upd(te,{t:v,p:tp});te=null}else{tk.push({id:Date.now(),t:v,p:tp,d:0,u:Date.now()});save()}
 $('#ti').value='';$('#ta').textContent='إضافة';drawTasks();upBadge()}
function openTasks(){te=null;
 $('#sb').innerHTML=`<h2>المهام والملاحظات</h2><p class="mu">للأشياء التي لا تحتاج تاريخاً في التقويم. اختاري الأولوية ثم أضيفي، واضغطي اسم الأولوية بجانب المهمة لتغييرها، واضغطي نص المهمة لتعديله.</p><div class="r"><input id="ti" style="flex:1;min-width:0" placeholder="اكتبي مهمة أو ملاحظة…" enterkeyhint="done"><button class="p" id="ta" style="flex:none">إضافة</button></div><div class="pc">${Object.entries(PR).map(([k,v])=>`<button data-p="${k}" style="--c:${v[1]}">${v[0]}</button>`).join('')}</div><div id="tl"></div>`;
 $('#ov').hidden=false;chips();drawTasks();
 $('#ti').onkeydown=e=>{if(e.key=='Enter')addTask()};
}
$('#sb').addEventListener('click',e=>{const t=e.target,q=t.dataset;
 if(q.p){tp=q.p;chips()}else if(t.id=='ta')addTask();
 else if(q.rm)upd(q.rm,{del:1});
 else if(q.pr){const x=tk.find(z=>z.id==q.pr);if(x)upd(x.id,{p:NX[x.p]})}
 else if(q.ed){const x=tk.find(z=>z.id==q.ed);if(x){te=x.id;tp=x.p;chips();$('#ti').value=x.t;$('#ti').focus();$('#ta').textContent='حفظ'}}
});
$('#sb').addEventListener('change',e=>{if(e.target.dataset.ck)upd(e.target.dataset.ck,{d:e.target.checked?1:0})});
$('#sy').onclick=openSync;$('#tb').onclick=openTasks;$('#vm').onclick=()=>sv('m');$('#va').onclick=()=>sv('a');
render();connect();
try{if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
</script></body></html>
